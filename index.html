<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7928CA">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Video Player</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #050507;
            font-family: Arial, sans-serif;
        }
        .glass {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <header class="text-white p-4 text-center glass">
        <h1 class="text-3xl">Luxury Video Player</h1>
    </header>
    <main class="container mx-auto p-4 pt-6 md:p-6 lg:p-12 xl:p-24">
        <section class="glass p-4 rounded">
            <h2 class="text-2xl">Select Video File</h2>
            <input type="file" id="videoFile" class="block w-full text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            <button id="playButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4">Play Video</button>
        </section>
        <section class="glass p-4 rounded mt-4">
            <h2 class="text-2xl">Video Player</h2>
            <video id="videoPlayer" class="w-full h-64" controls></video>
        </section>
    </main>
    <script>
        const videoFileInput = document.getElementById('videoFile');
        const playButton = document.getElementById('playButton');
        const videoPlayer = document.getElementById('videoPlayer');

        playButton.addEventListener('click', () => {
            const file = videoFileInput.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPlayer.src = url;
                videoPlayer.play();
            }
        });
    </script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body>
</html>
